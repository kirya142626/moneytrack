name: Production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  smoke:
    name: Check production
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Smoke test
        env:
          SMOKE_BASE_URL: https://getmoneytrack.ru
        run: node scripts/smoke.mjs
